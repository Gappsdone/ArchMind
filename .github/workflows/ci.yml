name: CI
on: [push, pull_request]
jobs:
  m1:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FOSS tooling and ArchMind
        run: python -m pip install ninja ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests
      - name: Test real CMake fixtures
        run: pytest -q
      - name: Build wheel
        run: python -m pip wheel --no-deps -w dist .

  frontend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and frontend
        run: |
          python -m pip install ninja ".[dev]"
          cd frontend
          npm ci
      - name: Frontend checks and bundle
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=low
      - name: Browser smoke test
        if: runner.os == 'Linux'
        working-directory: frontend
        run: |
          npx playwright install chromium --with-deps
          npm run test:e2e
