[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "archmind"
version = "0.1.0"
description = "Local-first CMake architecture intelligence"
requires-python = ">=3.12"
dependencies = ["alembic>=1.15,<2", "fastapi>=0.115,<1", "pydantic>=2,<3", "typer>=0.15,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
archmind = "archmind.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.setuptools.package-data]
archmind = ["migrations/env.py", "migrations/versions/*.py"]
